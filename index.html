<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/light.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/dark.svg" media="(prefers-color-scheme: dark)" />
    <title>Anodi</title>
    <script>
      // Prevent flash of wrong theme on load
      (function() {
        var theme = null;
        try {
          var stored = localStorage.getItem('anodi-theme');
          if (stored === 'light' || stored === 'dark') theme = stored;
        } catch (e) {}
        if (!theme) {
          try {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          } catch (e) { theme = 'light'; }
        }
        if (theme === 'dark') document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
